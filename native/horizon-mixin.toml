# Capipimon models: draws Cobblemon (Bedrock/Blockbench) creature models on Horizon mobs.
# Build: horizon-launcher native-build <this folder> --instance capipimon-dev --trust-native-code
[mod]
id = "capipimon_models"
version = "0.1.0"

[compatibility]
# Engine commit f40e3b7 (Capipimon fork of the last MIT Horizon 59dff1a: capipi branding, capipi loading scene, title logo), kept in our private fork Onii133/capipimon-engine.
horizon_revision = "f40e3b7e0d5e96da89a47c446843849f3b8650cc"

[api]
path = "api"

# GDD 3.1 while a Pokémon: third-person camera, no inventory, no hotbar number keys (frame.rs).
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Q is a move while a Pokémon, so it doesn't drop the held item (drop.rs).
[[injection]]
id = "drop"
target = "horizon_client::game::remote::Game<'_>::remote_drop"
kind = "HEAD"
cancellable = true
helper = "drop.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# F doesn't swap hands while a Pokémon (swap_hands.rs).
[[injection]]
id = "swap-hands"
target = "horizon_client::game::remote::Game<'_>::remote_swap_hands"
kind = "HEAD"
cancellable = true
helper = "swap_hands.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# T and Enter don't open the chat (Onii 2026-11-13: the mod uses them); `/` still does, with the
# slash typed (api: inject_capipimon_models_chat_open). The Tab menu's Chat row opens it in frame.rs.
[[injection]]
id = "chat-open"
target = "horizon_client::game::chat::Game<'_>::open_chat_method"
kind = "HEAD"
trait_method = "chat_open"
cancellable = true
bindings = [{ name = "prefix", ty = "&str", value = "prefix" }]

# No splash text on the title screen (self-contained: seasonal splashes ignore the resource list).
[[injection]]
id = "no-splash"
target = "horizon_client::title::Title::with_user"
kind = "HEAD"
helper = "no_splash.rs"
bindings = [{ name = "title", ty = "&mut crate::title::Title", value = "&mut self" }]

# Copies the generated content pack (tools/package/build_packages.py) beside the built game.
[[crate]]
id = "content_pack"
path = "content_pack"

[[post_build]]
crate = "content_pack"
bin = "install_pack"
args = []

# The private server marker mod (server-marker/, never published). When it's in the build folder Horizon turns on the
# cargo feature `capipimon_server`, which compiles in the server code (src/server/). Players never have it.
[dependencies]
capipimon_server = { version = "^0.1", optional = true }
# A private dev-only marker (never published, never in a player or live build).
capipimon_dev_mcp = { version = "^0.1", optional = true }
